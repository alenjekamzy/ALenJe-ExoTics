<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALenJe ExoTics | Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, serverTimestamp, getDocs, updateDoc, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        window.FirebaseSDK = { initializeApp, getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, serverTimestamp, getAuth, signInAnonymously, onAuthStateChanged, getDocs, updateDoc, query };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }
        .street-text { font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .emerald-glow { text-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
        ::-webkit-scrollbar { display: none; }
        .card-shadow { box-shadow: 0 20px 40px rgba(0,0,0,0.4); }
    </style>
</head>
<body class="bg-black text-white">
    <div id="root"></div>
    <script type="text/babel">
        const { initializeApp, getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, serverTimestamp, getAuth, signInAnonymously, onAuthStateChanged, getDocs, updateDoc, query } = window.FirebaseSDK;

        const firebaseConfig = {
          apiKey: "AIzaSyCUxzypGZxXnrRhfO0BiqkgcaSlVdgVON8",
          authDomain: "alenje-exotics.firebaseapp.com",
          projectId: "alenje-exotics",
          storageBucket: "alenje-exotics.firebasestorage.app",
          messagingSenderId: "25574137051",
          appId: "1:25574137051:web:a23b21764cd269560600fe"
        };

        const LeafIcon = ({size=24, color="#10b981"}) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill={color}>
                <path d="M12 22C12 22 13 18 17 15C18 14 22 14 22 14C22 14 18 13 15 11C16 7 15 2 15 2C15 2 13 6 12 10C11 6 9 2 9 2C9 2 8 7 9 11C6 13 2 14 2 14C2 14 6 14 7 15C11 18 12 22 12 22Z" />
            </svg>
        );

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [view, setView] = React.useState('menu'); // 'menu', 'chat', 'admin'
            const [inventory, setInventory] = React.useState([]);
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [adminKey, setAdminKey] = React.useState("");
            
            // Product Form State
            const [newStrain, setNewStrain] = React.useState({ name: '', price: '', thc: '', img: '' });

            const app = React.useMemo(() => initializeApp(firebaseConfig), []);
            const db = React.useMemo(() => getFirestore(app), [app]);
            const auth = React.useMemo(() => getAuth(app), [app]);
            const ID = "alenje_pro_v1";

            React.useEffect(() => {
                signInAnonymously(auth);
                onAuthStateChanged(auth, (u) => setUser(u));

                // Real-time Inventory
                const q = collection(db, 'artifacts', ID, 'public', 'data', 'inventory');
                return onSnapshot(q, (snapshot) => {
                    setInventory(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
            }, []);

            const addProduct = async () => {
                if(!newStrain.name || !newStrain.price) return;
                await addDoc(collection(db, 'artifacts', ID, 'public', 'data', 'inventory'), {
                    ...newStrain,
                    timestamp: serverTimestamp()
                });
                setNewStrain({ name: '', price: '', thc: '', img: '' });
            };

            const deleteProduct = async (id) => {
                await deleteDoc(doc(db, 'artifacts', ID, 'public', 'data', 'inventory', id));
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col relative pb-20">
                    {/* Header */}
                    <nav className="p-6 flex justify-between items-center sticky top-0 bg-black/80 backdrop-blur-md z-50">
                        <div className="flex items-center gap-2" onClick={() => setView('menu')}>
                            <LeafIcon size={28} />
                            <h1 className="street-text text-2xl emerald-glow text-emerald-400">ALEnJe</h1>
                        </div>
                        <button onClick={() => setView('admin')} className="p-2 glass rounded-full">
                            <LeafIcon size={18} color={isAdmin ? "#10b981" : "#fff"} />
                        </button>
                    </nav>

                    <main className="p-6 flex-1">
                        {view === 'menu' && (
                            <div className="space-y-10">
                                <header className="text-center py-4">
                                    <h2 className="text-6xl street-text leading-[0.8] mb-2">ALenJe<br/><span className="text-emerald-500">ExoTics</span></h2>
                                    <p className="text-[10px] uppercase font-black tracking-[0.4em] opacity-30 italic">Official Production</p>
                                </header>

                                {inventory.length === 0 ? (
                                    <div className="text-center py-20 glass rounded-[2rem] opacity-40">
                                        <p className="text-xs uppercase font-black tracking-widest">Awaiting Fresh Drops...</p>
                                    </div>
                                ) : (
                                    <div className="grid gap-8">
                                        {inventory.map(item => (
                                            <div key={item.id} className="glass rounded-[2.5rem] overflow-hidden card-shadow border border-white/5 group">
                                                <div className="h-72 relative bg-zinc-900">
                                                    {item.img ? (
                                                        <img src={item.img} className="w-full h-full object-cover grayscale group-hover:grayscale-0 transition-all duration-700" alt={item.name} />
                                                    ) : (
                                                        <div className="w-full h-full flex items-center justify-center opacity-10"><LeafIcon size={64} color="#fff" /></div>
                                                    )}
                                                    <div className="absolute top-6 right-6 bg-emerald-500 text-black px-4 py-1.5 rounded-full text-[10px] font-black italic">
                                                        {item.thc}% THC
                                                    </div>
                                                </div>
                                                <div className="p-8 flex justify-between items-center bg-zinc-950/50">
                                                    <div>
                                                        <h3 className="street-text text-3xl">{item.name}</h3>
                                                        <p className="text-2xl font-black italic text-emerald-400">${item.price}</p>
                                                    </div>
                                                    <button className="bg-white text-black px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest active:scale-90 transition-all">Order</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'admin' && (
                            <div className="space-y-8 animate-in fade-in duration-500">
                                {!isAdmin ? (
                                    <div className="glass p-10 rounded-[3rem] text-center space-y-6">
                                        <h2 className="street-text text-3xl text-emerald-500">Portal</h2>
                                        <input 
                                            type="password" 
                                            placeholder="ADMIN KEY" 
                                            className="w-full bg-zinc-900 p-5 rounded-2xl text-center border border-white/10 font-bold focus:border-emerald-500 outline-none" 
                                            onChange={e => setAdminKey(e.target.value)} 
                                        />
                                        <button 
                                            onClick={() => adminKey === "kamzyslime7@gmail.com" ? setIsAdmin(true) : alert("Unauthorised")} 
                                            className="w-full bg-emerald-500 text-black py-5 rounded-2xl font-black uppercase text-xs tracking-widest"
                                        >
                                            Access System
                                        </button>
                                    </div>
                                ) : (
                                    <div className="space-y-10">
                                        <div className="flex justify-between items-center">
                                            <h2 className="street-text text-4xl text-emerald-500">System</h2>
                                            <button onClick={() => setIsAdmin(false)} className="text-[10px] font-black opacity-40 uppercase">Lock</button>
                                        </div>

                                        <div className="glass p-8 rounded-[2.5rem] space-y-4 border border-emerald-500/20">
                                            <h3 className="text-xs font-black uppercase tracking-widest text-emerald-400">Add New Drop</h3>
                                            <input placeholder="Strain Name" className="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-sm" value={newStrain.name} onChange={e => setNewStrain({...newStrain, name: e.target.value})} />
                                            <div className="grid grid-cols-2 gap-4">
                                                <input placeholder="Price ($)" className="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-sm" value={newStrain.price} onChange={e => setNewStrain({...newStrain, price: e.target.value})} />
                                                <input placeholder="THC %" className="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-sm" value={newStrain.thc} onChange={e => setNewStrain({...newStrain, thc: e.target.value})} />
                                            </div>
                                            <input placeholder="Image URL (Unsplash/Imgur)" className="w-full bg-black/50 border border-white/10 p-4 rounded-xl text-sm" value={newStrain.img} onChange={e => setNewStrain({...newStrain, img: e.target.value})} />
                                            <button onClick={addProduct} className="w-full bg-emerald-500 text-black py-4 rounded-xl font-black text-xs uppercase tracking-tighter">Publish to Menu</button>
                                        </div>

                                        <div className="space-y-4">
                                            <h3 className="text-xs font-black uppercase tracking-widest opacity-40">Live Inventory</h3>
                                            {inventory.map(p => (
                                                <div key={p.id} className="p-5 glass rounded-2xl flex justify-between items-center">
                                                    <div>
                                                        <p className="font-black text-sm uppercase">{p.name}</p>
                                                        <p className="text-[10px] text-emerald-400">${p.price} | {p.thc}%</p>
                                                    </div>
                                                    <button onClick={() => deleteProduct(p.id)} className="text-red-500 text-[10px] font-black p-2">REMOVE</button>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    {/* Footer Nav */}
                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-xs glass rounded-full p-2 flex justify-around items-center z-50">
                        <button onClick={() => setView('menu')} className={`p-4 rounded-full transition-all ${view === 'menu' ? 'bg-emerald-500 text-black' : 'text-white/40'}`}>
                            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                        </button>
                        <button onClick={() => alert("Chat loading...")} className={`p-4 rounded-full transition-all ${view === 'chat' ? 'bg-emerald-500 text-black' : 'text-white/40'}`}>
                            <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 9h12v2H6V9zm8 5H6v-2h8v2zm4-6H6V6h12v2z"/></svg>
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
