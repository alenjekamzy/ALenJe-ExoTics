<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALenJe ExoTics | Elite Boutique</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, serverTimestamp, getDocs, updateDoc, query, orderBy, limit, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        window.FirebaseSDK = { initializeApp, getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, serverTimestamp, getAuth, signInAnonymously, onAuthStateChanged, getDocs, updateDoc, query, orderBy, limit, setDoc };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        :root { --bg: #000; --text: #fff; --glass: rgba(255,255,255,0.03); --border: rgba(255,255,255,0.1); }
        [data-theme='light'] { --bg: #f4f4f5; --text: #09090b; --glass: rgba(0,0,0,0.03); --border: rgba(0,0,0,0.1); }
        
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; transition: background 0.3s ease; -webkit-tap-highlight-color: transparent; }
        .street-text { font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; }
        .glass { background: var(--glass); backdrop-filter: blur(20px); border: 1px solid var(--border); }
        .emerald-glow { text-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
        ::-webkit-scrollbar { display: none; }
        .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }
    </style>
</head>
<body>
    <div id="root"></div>
    <script type="text/babel">
        const { initializeApp, getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, serverTimestamp, getAuth, signInAnonymously, onAuthStateChanged, query, orderBy, setDoc } = window.FirebaseSDK;

        const firebaseConfig = {
          apiKey: "AIzaSyCUxzypGZxXnrRhfO0BiqkgcaSlVdgVON8",
          authDomain: "alenje-exotics.firebaseapp.com",
          projectId: "alenje-exotics",
          storageBucket: "alenje-exotics.firebasestorage.app",
          messagingSenderId: "25574137051",
          appId: "1:25574137051:web:a23b21764cd269560600fe"
        };

        const icons = {
            leaf: (s=24, c="#10b981") => <svg width={s} height={s} viewBox="0 0 24 24" fill={c}><path d="M12 22C12 22 13 18 17 15C18 14 22 14 22 14C22 14 18 13 15 11C16 7 15 2 15 2C15 2 13 6 12 10C11 6 9 2 9 2C9 2 8 7 9 11C6 13 2 14 2 14C2 14 6 14 7 15C11 18 12 22 12 22Z"/></svg>,
            chat: (s=20) => <svg width={s} height={s} fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>,
            feed: (s=20) => <svg width={s} height={s} fill="currentColor" viewBox="0 0 24 24"><path d="M4 4h7V2H4c-1.1 0-2 .9-2 2v7h2V4zm6 9l-4 5h12l-3-4-2.03 2.71L10 13zm7-11h-7v2h7v7h2V4c0-1.1-.9-2-2-2zM4 13H2v7c0 1.1.9 2 2 2h7v-2H4v-7zm13 7h-7v2h7c1.1 0 2-.9 2-2v-7h-2v7z"/></svg>,
            home: (s=20) => <svg width={s} height={s} fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>,
            profile: (s=20) => <svg width={s} height={s} fill="currentColor" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
        };

        const App = () => {
            const [user, setUser] = React.useState(null);
            const [profile, setProfile] = React.useState({ name: 'Guest', theme: 'dark' });
            const [view, setView] = React.useState('menu'); 
            const [inventory, setInventory] = React.useState([]);
            const [posts, setPosts] = React.useState([]);
            const [messages, setMessages] = React.useState([]);
            const [isAdmin, setIsAdmin] = React.useState(false);
            const [adminKey, setAdminKey] = React.useState("");
            
            const [newStrain, setNewStrain] = React.useState({ name: '', price: '', thc: '', img: '' });
            const [newPost, setNewPost] = React.useState({ text: '', img: '' });
            const [chatInput, setChatInput] = React.useState("");
            const [notif, setNotif] = React.useState(null);

            const app = React.useMemo(() => initializeApp(firebaseConfig), []);
            const db = React.useMemo(() => getFirestore(app), [app]);
            const auth = React.useMemo(() => getAuth(app), [app]);
            const ID = "alenje_elite_v1";

            React.useEffect(() => {
                onAuthStateChanged(auth, async (u) => {
                    if (u) {
                        setUser(u);
                        // Track Location & Device
                        const device = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ? 'Mobile' : 'Desktop';
                        let city = "Unknown";
                        try {
                            const geo = await fetch('https://ipapi.co/json/').then(r => r.json());
                            city = geo.city + ", " + geo.country_name;
                        } catch(e) {}
                        
                        await setDoc(doc(db, 'artifacts', ID, 'users', u.uid, 'meta', 'info'), {
                            lastSeen: Date.now(),
                            location: city,
                            device: device
                        });

                        // Load Profile
                        onSnapshot(doc(db, 'artifacts', ID, 'users', u.uid, 'profile', 'data'), (d) => {
                            if(d.exists()) {
                                setProfile(d.data());
                                document.documentElement.setAttribute('data-theme', d.data().theme || 'dark');
                            }
                        });
                    } else {
                        signInAnonymously(auth);
                    }
                });

                onSnapshot(collection(db, 'artifacts', ID, 'public', 'data', 'inventory'), (s) => {
                    const items = s.docs.map(d => ({ id: d.id, ...d.data() }));
                    setInventory(items);
                    // Simple logic for New Drop Notification
                    const latest = Math.max(...items.map(i => i.created || 0));
                    if(latest > Date.now() - 3600000) setNotif("New Exotic Drop Just Landed!");
                });

                onSnapshot(collection(db, 'artifacts', ID, 'public', 'data', 'feed'), (s) => {
                    setPosts(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => b.time - a.time));
                });
            }, []);

            React.useEffect(() => {
                if(!user) return;
                return onSnapshot(collection(db, 'artifacts', ID, 'public', 'data', 'chats'), (s) => {
                    setMessages(s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a,b) => a.time - b.time));
                });
            }, [user]);

            const uploadImg = async (file) => {
                const fd = new FormData(); fd.append('image', file);
                const res = await fetch('https://api.imgbb.com/1/upload?key=819777174640824057e0344f620f4c6e', { method: 'POST', body: fd });
                const data = await res.json();
                return data.data.url;
            };

            const addProduct = async () => {
                await addDoc(collection(db, 'artifacts', ID, 'public', 'data', 'inventory'), { ...newStrain, created: Date.now() });
                setNewStrain({ name: '', price: '', thc: '', img: '' });
                alert("Drop Published!");
            };

            const submitPost = async () => {
                await addDoc(collection(db, 'artifacts', ID, 'public', 'data', 'feed'), { ...newPost, author: profile.name, uid: user.uid, time: Date.now() });
                setNewPost({ text: '', img: '' });
            };

            return (
                <div className="max-w-md mx-auto min-h-screen flex flex-col relative pb-24">
                    {notif && (
                        <div className="fixed top-20 left-4 right-4 z-[100] bg-emerald-500 text-black p-4 rounded-2xl flex justify-between items-center shadow-2xl animate-bounce">
                            <span className="text-xs font-black uppercase tracking-tighter">{notif}</span>
                            <button onClick={() => setNotif(null)} className="font-bold">✕</button>
                        </div>
                    )}

                    <nav className="p-6 flex justify-between items-center sticky top-0 bg-inherit backdrop-blur-xl z-50 border-b border-white/5">
                        <div className="flex items-center gap-2" onClick={() => setView('menu')}>
                            {icons.leaf(28)}
                            <h1 className="street-text text-xl emerald-glow text-emerald-400">ALEnJe</h1>
                        </div>
                        <div className="flex gap-4">
                            <button onClick={() => setView('profile')} className="p-2 glass rounded-full">{icons.profile(18)}</button>
                            <button onClick={() => setView('admin')} className={`p-2 rounded-full border ${isAdmin ? 'border-emerald-500' : 'border-white/10 glass'}`}>{icons.leaf(16, isAdmin ? "#10b981" : "currentColor")}</button>
                        </div>
                    </nav>

                    <main className="p-6 flex-1">
                        {view === 'menu' && (
                            <div className="space-y-8">
                                <header className="text-center py-6">
                                    <h2 className="text-6xl street-text leading-[0.8] mb-2">ALenJe<br/><span className="text-emerald-500">ExoTics</span></h2>
                                    <p className="text-[10px] uppercase font-black tracking-[0.4em] opacity-30 italic">Official Menu • MWK</p>
                                </header>
                                <div className="grid gap-6">
                                    {inventory.map(item => (
                                        <div key={item.id} className="glass rounded-[2rem] overflow-hidden border border-white/5 shadow-2xl">
                                            <div className="h-72 relative bg-zinc-900">
                                                <img src={item.img || 'https://via.placeholder.com/400x500'} className="w-full h-full object-cover" />
                                                <div className="absolute top-4 right-4 bg-emerald-500 text-black px-3 py-1 rounded-full text-[9px] font-black italic">{item.thc}% THC</div>
                                            </div>
                                            <div className="p-8 flex justify-between items-center bg-zinc-950/20">
                                                <div>
                                                    <h3 className="street-text text-2xl leading-none mb-1">{item.name}</h3>
                                                    <p className="text-xl font-black italic text-emerald-400">MWK {Number(item.price).toLocaleString()}</p>
                                                </div>
                                                <button onClick={() => { setView('chat'); setChatInput(`Yo Alenje! Checkin for ${item.name}.`); }} className="bg-emerald-500 text-black px-6 py-3 rounded-xl font-black text-[10px] uppercase tracking-widest active:scale-95 transition-all">Order</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'feed' && (
                            <div className="space-y-6">
                                <h2 className="street-text text-3xl text-emerald-500">The Feed</h2>
                                <div className="glass p-6 rounded-3xl space-y-4">
                                    <div className="flex gap-4">
                                        <div className="w-12 h-12 glass rounded-xl flex items-center justify-center relative overflow-hidden">
                                            {newPost.img ? <img src={newPost.img} className="w-full h-full object-cover" /> : icons.leaf(20, "#333")}
                                            <input type="file" className="absolute inset-0 opacity-0" onChange={async e => setNewPost({...newPost, img: await uploadImg(e.target.files[0])})} />
                                        </div>
                                        <textarea value={newPost.text} onChange={e => setNewPost({...newPost, text: e.target.value})} placeholder="Show off your Alenje stash..." className="flex-1 bg-transparent text-sm p-2 outline-none resize-none" rows="2"></textarea>
                                    </div>
                                    <button onClick={submitPost} className="w-full bg-white text-black py-3 rounded-xl font-black text-[10px] uppercase tracking-widest">Share to Community</button>
                                </div>
                                <div className="space-y-6">
                                    {posts.map(post => (
                                        <div key={post.id} className="glass rounded-3xl overflow-hidden">
                                            {post.img && <img src={post.img} className="w-full h-64 object-cover" />}
                                            <div className="p-6">
                                                <div className="flex justify-between items-center mb-3">
                                                    <span className="text-[10px] font-black uppercase text-emerald-500">{post.author}</span>
                                                    <span className="text-[8px] opacity-30">{new Date(post.time).toLocaleDateString()}</span>
                                                </div>
                                                <p className="text-sm italic opacity-80">"{post.text}"</p>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        )}

                        {view === 'chat' && (
                            <div className="flex flex-col h-[75vh]">
                                <div className="flex-1 overflow-y-auto space-y-4 pb-4">
                                    {messages.filter(m => m.uid === user.uid).map(m => (
                                        <div key={m.id} className={`flex ${m.sender === 'admin' ? 'justify-start' : 'justify-end'}`}>
                                            <div className={`p-4 max-w-[85%] text-[11px] font-bold rounded-2xl ${m.sender === 'admin' ? 'bg-emerald-500/20 border border-emerald-500/30' : 'bg-white/5'}`}>
                                                {m.text}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                                <div className="flex gap-2 p-2 glass rounded-2xl">
                                    <input value={chatInput} onChange={e => setChatInput(e.target.value)} onKeyPress={e => e.key === 'Enter' && addDoc(collection(db, 'artifacts', ID, 'public', 'data', 'chats'), { text: chatInput, sender: 'user', uid: user.uid, time: Date.now() }).then(() => setChatInput(""))} placeholder="Message Alenje..." className="flex-1 bg-transparent px-4 text-[11px] outline-none" />
                                    <button onClick={() => addDoc(collection(db, 'artifacts', ID, 'public', 'data', 'chats'), { text: chatInput, sender: 'user', uid: user.uid, time: Date.now() }).then(() => setChatInput(""))} className="bg-emerald-500 text-black p-3 rounded-xl font-black">{icons.leaf(16, "#000")}</button>
                                </div>
                            </div>
                        )}

                        {view === 'profile' && (
                            <div className="space-y-8 text-center animate-in zoom-in-95 duration-300">
                                <h2 className="street-text text-4xl text-emerald-500 mt-10">Profile</h2>
                                <div className="glass p-8 rounded-[3rem] space-y-6">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase opacity-40">Display Name</label>
                                        <input value={profile.name} onChange={e => {
                                            const n = e.target.value;
                                            setProfile({...profile, name: n});
                                            setDoc(doc(db, 'artifacts', ID, 'users', user.uid, 'profile', 'data'), { name: n, theme: profile.theme }, {merge: true});
                                        }} className="w-full bg-black/40 p-4 rounded-2xl text-center text-sm font-bold border border-white/10" />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase opacity-40">System Theme</label>
                                        <div className="flex gap-2 justify-center">
                                            {['dark', 'light', 'system'].map(t => (
                                                <button key={t} onClick={() => {
                                                    setProfile({...profile, theme: t});
                                                    setDoc(doc(db, 'artifacts', ID, 'users', user.uid, 'profile', 'data'), { theme: t }, {merge: true});
                                                }} className={`px-4 py-2 rounded-full text-[9px] font-black uppercase border transition-all ${profile.theme === t ? 'bg-white text-black border-white' : 'border-white/10 opacity-40'}`}>{t}</button>
                                            ))}
                                        </div>
                                    </div>
                                </div>
                                <div className="opacity-10 text-[9px] font-black uppercase tracking-widest">Client ID: {user?.uid.slice(0,10)}</div>
                            </div>
                        )}

                        {view === 'admin' && (
                            <div className="space-y-8">
                                {!isAdmin ? (
                                    <div className="glass p-10 rounded-[3rem] text-center space-y-6 mt-10">
                                        <h2 className="street-text text-3xl text-emerald-500 underline decoration-white/10">Admin Access</h2>
                                        <input type="password" placeholder="KEY" className="w-full bg-zinc-900 p-5 rounded-2xl text-center border border-white/10" onChange={e => setAdminKey(e.target.value)} />
                                        <button onClick={() => adminKey === "kamzyslime7@gmail.com" ? setIsAdmin(true) : alert("Unauthorised")} className="w-full bg-emerald-500 text-black py-4 rounded-2xl font-black uppercase text-[10px]">Enter System</button>
                                    </div>
                                ) : (
                                    <div className="space-y-10">
                                        <div className="flex justify-between items-center">
                                            <h2 className="street-text text-4xl text-emerald-500">System</h2>
                                            <button onClick={() => setIsAdmin(false)} className="text-[10px] font-black opacity-30">Lock</button>
                                        </div>

                                        <div className="glass p-8 rounded-[3rem] space-y-4">
                                            <h3 className="text-[10px] font-black uppercase text-emerald-400">Add New Drop</h3>
                                            <div className="flex gap-4 items-center mb-4">
                                                <div className="w-20 h-20 bg-black/50 border border-dashed border-white/20 rounded-2xl overflow-hidden flex items-center justify-center relative">
                                                    {newStrain.img ? <img src={newStrain.img} className="w-full h-full object-cover" /> : icons.leaf(20, "#333")}
                                                    <input type="file" className="absolute inset-0 opacity-0" onChange={async e => setNewStrain({...newStrain, img: await uploadImg(e.target.files[0])})} />
                                                </div>
                                                <p className="text-[9px] font-bold opacity-30">Upload product photo</p>
                                            </div>
                                            <input placeholder="STRAIN NAME" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs" value={newStrain.name} onChange={e => setNewStrain({...newStrain, name: e.target.value})} />
                                            <div className="grid grid-cols-2 gap-4">
                                                <input placeholder="PRICE (MWK)" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs" value={newStrain.price} onChange={e => setNewStrain({...newStrain, price: e.target.value})} />
                                                <input placeholder="THC %" className="w-full bg-black/40 border border-white/10 p-4 rounded-xl text-xs" value={newStrain.thc} onChange={e => setNewStrain({...newStrain, thc: e.target.value})} />
                                            </div>
                                            <button onClick={addProduct} className="w-full bg-white text-black py-4 rounded-xl font-black text-[10px] uppercase">Publish Drop</button>
                                        </div>

                                        <div className="space-y-4">
                                            <h3 className="text-[10px] font-black uppercase text-emerald-400">Client Radar (Live)</h3>
                                            {[...new Set(messages.map(m => m.uid))].map(uId => (
                                                <div key={uId} className="p-5 glass rounded-2xl border border-white/5 space-y-3">
                                                    <div className="flex justify-between items-start">
                                                        <div>
                                                            <p className="text-[11px] font-black text-emerald-500 uppercase tracking-tighter">Client {uId.slice(0,8)}</p>
                                                            <p className="text-[9px] opacity-30 mt-1 font-bold">Location & Analytics loading...</p>
                                                        </div>
                                                        <span className="text-[8px] bg-white/10 px-2 py-1 rounded">LIVE</span>
                                                    </div>
                                                    <div className="max-h-32 overflow-y-auto space-y-2 py-2 border-y border-white/5">
                                                        {messages.filter(m => m.uid === uId).map(m => (
                                                            <p key={m.id} className="text-[10px] opacity-70 italic">
                                                                <span className="text-emerald-500 font-bold uppercase">{m.sender}: </span>{m.text}
                                                            </p>
                                                        ))}
                                                    </div>
                                                    <div className="flex gap-2">
                                                        <input id={`r-${uId}`} placeholder="Reply..." className="flex-1 bg-black/40 p-3 rounded-xl text-[10px]" />
                                                        <button onClick={() => {
                                                            const val = document.getElementById(`r-${uId}`).value;
                                                            addDoc(collection(db, 'artifacts', ID, 'public', 'data', 'chats'), { text: val, sender: 'admin', uid: uId, time: Date.now() });
                                                            document.getElementById(`r-${uId}`).value = "";
                                                        }} className="bg-emerald-500 text-black px-4 rounded-xl font-black text-[9px]">SEND</button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>

                    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[92%] max-w-sm glass rounded-full p-2 flex justify-around items-center z-50 safe-bottom shadow-2xl border-t border-white/10">
                        <button onClick={() => setView('menu')} className={`p-4 rounded-full transition-all ${view === 'menu' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'text-white/30'}`}>{icons.home()}</button>
                        <button onClick={() => setView('feed')} className={`p-4 rounded-full transition-all ${view === 'feed' ? 'bg-emerald-500 text-black' : 'text-white/30'}`}>{icons.feed()}</button>
                        <button onClick={() => setView('chat')} className={`p-4 rounded-full transition-all relative ${view === 'chat' ? 'bg-emerald-500 text-black' : 'text-white/30'}`}>
                            {icons.chat()}
                            {messages.some(m => m.sender === 'admin' && m.uid === user?.uid) && view !== 'chat' && (
                                <div className="absolute top-3 right-3 w-2 h-2 bg-red-500 rounded-full border border-black animate-pulse"></div>
                            )}
                        </button>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
