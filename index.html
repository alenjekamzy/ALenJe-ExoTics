<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  google-site-verification: googlef840bb69c67d5fcf.html
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alenje Exotics | Premium Selection</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Firebase Compat SDKs (Ultra-stable for HTML) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-[#030303] text-white">
  <div id="root"></div>

  <script type="text/babel">
    // --- Firebase Configuration ---
    const firebaseConfig = {
      apiKey: "AIzaSyCUxzypGZxXnrRhfO0BiqkgcaSlVdgVON8",
      authDomain: "alenje-exotics.firebaseapp.com",
      projectId: "alenje-exotics",
      storageBucket: "alenje-exotics.firebasestorage.app",
      messagingSenderId: "25574137051",
      appId: "1:25574137051:web:a23b21764cd269560600fe"
    };

    // Initialize Firebase Compat
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();
    const appId = 'alenje-exotics';

    // --- Admin Configuration ---
    const ADMIN_PASSCODE = "kamzy777"; 

    // --- Icon Component Definitions ---
    const LeafIcon = () => <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17,8C8,10 5.9,16.17 3.82,21.34L5.71,22L6.66,19.7C7.14,19.87 7.64,20 8.13,20C11,20 13.54,18.06 14.88,15.11C15.6,15.11 16.32,15.06 17.03,14.97C18.66,14.77 20,13.38 20,11.74V2H17.03L17,8Z" /></svg>;
    const HomeIcon = () => <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>;
    const UsersIcon = () => <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>;
    const ChatIcon = () => <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>;
    const SettingsIcon = () => <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>;
    const SunIcon = () => <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>;
    const MoonIcon = () => <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12.1 22c4.9 0 9-3.6 10-8.3.2-1.1-.9-1.9-1.8-1.5-1.1.5-2.2.8-3.5.8-4.4 0-8-3.6-8-8 0-1.2.3-2.4.8-3.5.4-.9-.4-1.9-1.5-1.8C3.6 1 0 5.1 0 10c0 6.6 5.4 12 12.1 12z"/></svg>;
    const CameraIcon = () => <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12m-3.2 0a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5s5 2.24 5 5s-2.24 5-5 5z"/></svg>;
    const TrashIcon = () => <svg width="18" height="18" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" strokeLinecap="round" strokeLinejoin="round"/></svg>;
    const SendIcon = () => <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>;

    function App() {
      const [user, setUser] = React.useState(null);
      const [profile, setProfile] = React.useState({
        name: 'Guest Explorer',
        photo: 'https://api.dicebear.com/7.x/bottts/svg?seed=default',
        caption: 'Exploring Alenje Exotics',
        phone: ''
      });
      const [view, setView] = React.useState('menu'); // menu, community, chat, settings, admin
      const [category, setCategory] = React.useState('All');
      const [inventory, setInventory] = React.useState([]);
      const [posts, setPosts] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [isSavingProfile, setIsSavingProfile] = React.useState(false);
      const [darkMode, setDarkMode] = React.useState(true);
      const [newPost, setNewPost] = React.useState("");
      const [postImage, setPostImage] = React.useState("");
      
      // Admin Security & Mode States
      const [isAdmin, setIsAdmin] = React.useState(false); 
      const [showPasscodeModal, setShowPasscodeModal] = React.useState(false);
      const [passcodeInput, setPasscodeInput] = React.useState("");
      const [passcodeError, setPasscodeError] = React.useState(false);

      // On-Site Real-time Chat States
      const [rawMessages, setRawMessages] = React.useState([]);
      const [chatInput, setChatInput] = React.useState("");
      const [selectedChatUserId, setSelectedChatUserId] = React.useState(null); // Admin only

      // Admin Form State
      const [newItem, setNewItem] = React.useState({ name: '', price: '', category: 'Strains', thc: '24', img: '' });

      const postFileRef = React.useRef(null);
      const adminFileRef = React.useRef(null);
      const profileFileRef = React.useRef(null);
      const chatEndRef = React.useRef(null);

      // --- Auth & Profile Loading ---
      React.useEffect(() => {
        const initAuth = async () => {
          try {
            await auth.signInAnonymously();
          } catch (err) {
            console.error("Auth failed:", err);
          }
        };
        initAuth();

        const unsubscribe = auth.onAuthStateChanged(async (u) => {
          setUser(u);
          if (u) {
            const profileRef = db.collection('artifacts').doc(appId).collection('users').doc(u.uid).collection('profile').doc('info');
            try {
              const snap = await profileRef.get();
              if (snap.exists) {
                setProfile(snap.data());
              } else {
                const defaultProfile = {
                  name: 'Guest Explorer',
                  photo: `https://api.dicebear.com/7.x/bottts/svg?seed=${u.uid}`,
                  caption: 'Exploring Alenje Exotics',
                  phone: ''
                };
                setProfile(defaultProfile);
                await profileRef.set(defaultProfile);
              }
            } catch (e) {
              console.error("Profile load error:", e);
            }
          }
          setLoading(false);
        });
        return () => unsubscribe();
      }, []);

      // --- Data Listeners ---
      React.useEffect(() => {
        if (!user) return;

        // 1. Inventory Sync
        const invRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('inventory');
        const unsubInv = invRef.onSnapshot((s) => {
          setInventory(s.docs.map(d => ({ id: d.id, ...d.data() })));
        }, (err) => console.error("Inventory error:", err));

        // 2. Community Board Sync
        const postsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('community');
        const unsubPosts = postsRef.onSnapshot((s) => {
          const sorted = s.docs.map(d => ({ id: d.id, ...d.data() }))
            .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
          setPosts(sorted);
        }, (err) => console.error("Community error:", err));

        // 3. Live On-Site Messages Sync
        const chatRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('chats');
        const unsubChat = chatRef.onSnapshot((s) => {
          setRawMessages(s.docs.map(d => ({ id: d.id, ...d.data() })));
        }, (err) => console.error("Chats load error:", err));

        return () => { unsubInv(); unsubPosts(); unsubChat(); };
      }, [user]);

      // --- Scroll Chat to Bottom ---
      React.useEffect(() => {
        chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
      }, [rawMessages, view, selectedChatUserId]);

      const handleFileUpload = (e, callback) => {
        const file = e.target.files[0];
        if (!file) return;
        if (file.size > 800000) return; 

        const reader = new FileReader();
        reader.onloadend = () => callback(reader.result);
        reader.readAsDataURL(file);
      };

      const saveProfile = async () => {
        if (!user) return;
        setIsSavingProfile(true);
        try {
          const profileRef = db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('profile').doc('info');
          await profileRef.set({ ...profile, updatedAt: firebase.firestore.FieldValue.serverTimestamp() });
        } catch (err) { console.error(err); } 
        finally { setIsSavingProfile(false); }
      };

      const handlePost = async (e) => {
        e.preventDefault();
        if (!user || (!newPost.trim() && !postImage)) return;
        try {
          await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('community').add({
            text: newPost,
            image: postImage,
            userName: profile.name,
            userPhoto: profile.photo,
            userPhone: profile.phone,
            timestamp: firebase.firestore.FieldValue.serverTimestamp(),
            uid: user.uid
          });
          setNewPost("");
          setPostImage("");
        } catch (err) { console.error(err); }
      };

      const handleAddProduct = async (e) => {
        e.preventDefault();
        if (!newItem.name || !newItem.price) return;
        try {
          await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('inventory').add({
            ...newItem,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
          setNewItem({ name: '', price: '', category: 'Strains', thc: '24', img: '' });
        } catch (err) { console.error(err); }
      };

      const deleteProduct = async (id) => {
        await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('inventory').doc(id).delete();
      };

      // --- Send On-Site Direct Message ---
      const handleSendMessage = async (e) => {
        e.preventDefault();
        if (!chatInput.trim() || !user) return;

        // If regular user, room is their own UID. If admin, room is the selected user's UID.
        const targetRoomId = isAdmin ? selectedChatUserId : user.uid;

        try {
          await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('chats').add({
            text: chatInput,
            chatRoomId: targetRoomId,
            senderId: user.uid,
            senderName: isAdmin ? "Alenje Support" : (profile.name || "Guest"),
            senderPhoto: isAdmin ? "https://api.dicebear.com/7.x/bottts/svg?seed=support" : profile.photo,
            timestamp: firebase.firestore.FieldValue.serverTimestamp()
          });
          setChatInput("");
        } catch (err) {
          console.error("Direct Message failed:", err);
        }
      };

      // --- Passcode Verification ---
      const verifyAdminAccess = (e) => {
        e.preventDefault();
        if (passcodeInput === ADMIN_PASSCODE) {
          setPasscodeError(false);
          setShowPasscodeModal(false);
          setPasscodeInput("");
          setIsAdmin(true);
          setView('admin');
        } else {
          setPasscodeError(true);
        }
      };

      // --- Filtered Messages Logic (RULE 2: Filter in memory) ---
      const activeMessages = React.useMemo(() => {
        const targetRoom = isAdmin ? selectedChatUserId : (user ? user.uid : null);
        if (!targetRoom) return [];
        return rawMessages
          .filter(m => m.chatRoomId === targetRoom)
          .sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
      }, [rawMessages, isAdmin, selectedChatUserId, user]);

      // --- Group Active Chat Threads (For Admin Dashboard) ---
      const activeAdminThreads = React.useMemo(() => {
        if (!isAdmin) return [];
        const threadsMap = {};
        rawMessages.forEach(msg => {
          if (!msg.chatRoomId) return;
          const roomId = msg.chatRoomId;
          // Don't show admin's own responses as user identity
          if (!threadsMap[roomId] || (msg.timestamp?.seconds || 0) > (threadsMap[roomId].latestTime || 0)) {
            threadsMap[roomId] = {
              roomId,
              latestMessage: msg.text,
              latestTime: msg.timestamp?.seconds || 0,
              senderName: msg.senderId !== user?.uid ? msg.senderName : (threadsMap[roomId]?.senderName || "Active Customer"),
              senderPhoto: msg.senderId !== user?.uid ? msg.senderPhoto : (threadsMap[roomId]?.senderPhoto || "https://api.dicebear.com/7.x/bottts/svg?seed=guest")
            };
          }
        });
        return Object.values(threadsMap).sort((a, b) => b.latestTime - a.latestTime);
      }, [rawMessages, isAdmin, user]);

      if (loading) return (
        <div className="h-screen flex items-center justify-center bg-black text-emerald-500 font-black uppercase text-xs tracking-widest animate-pulse">
          Connecting to Alenje Vault...
        </div>
      );

      return (
        <div className={`min-h-screen transition-colors duration-500 ${darkMode ? 'bg-[#030303] text-white' : 'bg-[#f8f9fa] text-black'}`}>
          <div className="max-w-[440px] mx-auto px-5 pb-32">
            
            {/* Header */}
            <header className="sticky top-0 z-[100] py-6 flex justify-between items-center bg-transparent backdrop-blur-md">
              <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('menu')}>
                <div className="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center shadow-lg shadow-emerald-500/20">
                  <LeafIcon />
                </div>
                <span className="font-black text-lg italic tracking-tighter uppercase text-emerald-500">Alenje Exotics</span>
              </div>
              <button onClick={() => setDarkMode(!darkMode)} className="w-10 h-10 bg-white/5 border border-emerald-500/20 rounded-xl flex items-center justify-center transition-all">
                {darkMode ? <SunIcon /> : <MoonIcon />}
              </button>
            </header>

            <main className="animate-in fade-in duration-700">
              {view === 'menu' && (
                <div className="space-y-8">
                  <div className="text-center py-4">
                    <h1 className="font-black text-6xl leading-[0.8] mb-2 tracking-tighter uppercase italic">
                      ALENJE<br/><span className="text-emerald-500">EXOTICS</span>
                    </h1>
                    <p className="opacity-40 text-[9px] font-black uppercase tracking-[0.4em] mt-4">Malawi's Premium Delivery</p>
                  </div>

                  {/* Categories */}
                  <div className="flex gap-3 overflow-x-auto pb-2 no-scrollbar">
                    {['All', 'Strains', 'Vapes', 'Edibles', 'Gear'].map(cat => (
                      <button 
                        key={cat} 
                        onClick={() => setCategory(cat)} 
                        className={`px-6 py-3 rounded-xl text-[10px] font-black uppercase tracking-widest transition-all whitespace-nowrap ${category === cat ? 'bg-emerald-500 text-black' : 'bg-white/5 border border-white/10 opacity-60'}`}
                      >
                        {cat}
                      </button>
                    ))}
                  </div>

                  {/* Grid */}
                  <div className="grid gap-8">
                    {inventory.filter(i => category === 'All' || i.category === category).map(item => (
                      <div key={item.id} className="bg-white/5 border border-emerald-500/10 rounded-3xl overflow-hidden group">
                        <div className="relative h-72">
                          <img src={item.img || "https://images.unsplash.com/photo-1536633314979-d204bfce4602?w=600"} className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-700" alt={item.name} />
                          <div className="absolute inset-0 bg-gradient-to-t from-black via-transparent to-transparent"></div>
                          <div className="absolute top-4 right-4 bg-emerald-500 text-black px-3 py-1 rounded-lg font-black text-[9px] uppercase">
                            {item.thc}% THC
                          </div>
                        </div>
                        <div className="p-6">
                          <div className="flex justify-between items-end mb-4">
                            <div>
                              <span className="text-[9px] font-black text-emerald-400 uppercase tracking-widest">{item.category}</span>
                              <h3 className="font-black text-2xl uppercase italic">{item.name}</h3>
                            </div>
                            <div className="text-right">
                              <span className="text-xl font-black italic text-emerald-500">K{item.price}</span>
                            </div>
                          </div>
                          <button onClick={() => { if(isAdmin){ setView('settings'); } else { setView('chat'); } }} className="w-full py-4 bg-emerald-500 rounded-xl font-black text-black text-[10px] uppercase tracking-widest active:scale-95 transition-all">
                            Secure Order
                          </button>
                        </div>
                      </div>
                    ))}
                    {inventory.length === 0 && <p className="text-center py-20 opacity-20 uppercase font-black text-xs">Awaiting Shipment...</p>}
                  </div>
                </div>
              )}

              {view === 'community' && (
                <div className="space-y-8">
                  <h2 className="font-black text-4xl uppercase italic leading-[0.8]">LOCAL<br/><span className="text-emerald-500">VIBE</span></h2>
                  
                  <form onSubmit={handlePost} className="bg-white/5 border border-emerald-500/20 p-5 rounded-3xl">
                    <textarea 
                      value={newPost} 
                      onChange={(e) => setNewPost(e.target.value)} 
                      placeholder="Drop a vibe..." 
                      className="w-full bg-transparent outline-none text-sm font-semibold resize-none mb-4 min-h-[60px]" 
                    />
                    {postImage && (
                      <div className="relative w-full h-40 rounded-xl overflow-hidden mb-4 border border-emerald-500/20">
                        <img src={postImage} className="w-full h-full object-cover" />
                        <button type="button" onClick={() => setPostImage("")} className="absolute top-2 right-2 w-6 h-6 bg-black/60 rounded-full flex items-center justify-center text-xs">✕</button>
                      </div>
                    )}
                    <div className="flex justify-between items-center">
                      <button type="button" onClick={() => postFileRef.current.click()} className="w-10 h-10 flex items-center justify-center bg-white/5 rounded-lg border border-white/10 text-emerald-500">
                        <CameraIcon />
                        <input type="file" accept="image/*" ref={postFileRef} className="hidden" onChange={(e) => handleFileUpload(e, setPostImage)} />
                      </button>
                      <button className="px-8 py-3 bg-emerald-500 text-black text-[10px] font-black uppercase rounded-xl">Post</button>
                    </div>
                  </form>

                  <div className="space-y-10">
                    {posts.map(post => (
                      <div key={post.id} className="border-b border-white/5 pb-8">
                        <div className="flex items-center gap-3 mb-4">
                          <img src={post.userPhoto} className="w-9 h-9 rounded-xl bg-zinc-800 border border-emerald-500/20" />
                          <div>
                            <h4 className="font-bold text-[11px] uppercase tracking-tight">{post.userName}</h4>
                            <p className="text-[8px] opacity-40 uppercase font-black">
                              {post.timestamp ? new Date(post.timestamp.seconds * 1000).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : 'Active'}
                            </p>
                          </div>
                        </div>
                        {post.image && <img src={post.image} className="rounded-2xl mb-4 w-full h-auto max-h-[400px] object-cover border border-white/5 shadow-2xl" />}
                        <p className="text-sm font-medium opacity-80 italic">{post.text}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {view === 'settings' && (
                <div className="space-y-8">
                  <h2 className="font-black text-4xl uppercase italic">USER<br/><span className="text-emerald-500">VAULT</span></h2>
                  <div className="bg-white/5 border border-emerald-500/20 rounded-[2rem] p-6 space-y-6">
                    <div className="flex flex-col items-center">
                      <div onClick={() => profileFileRef.current.click()} className="relative w-24 h-24 mb-4 group cursor-pointer">
                        <img src={profile.photo} className="w-full h-full rounded-[1.8rem] object-cover border-2 border-emerald-500" />
                        <input type="file" accept="image/*" ref={profileFileRef} className="hidden" onChange={(e) => handleFileUpload(e, (res) => setProfile({...profile, photo: res}))} />
                      </div>
                    </div>

                    <div className="space-y-4">
                      <input value={profile.name} onChange={e => setProfile({...profile, name: e.target.value})} placeholder="Display Name" className="w-full bg-black/40 border border-white/5 p-4 rounded-xl text-sm font-bold outline-none focus:border-emerald-500" />
                      <input value={profile.phone} onChange={e => setProfile({...profile, phone: e.target.value})} placeholder="WhatsApp Number" className="w-full bg-black/40 border border-white/5 p-4 rounded-xl text-sm font-bold outline-none focus:border-emerald-500" />
                      <textarea value={profile.caption} onChange={e => setProfile({...profile, caption: e.target.value})} placeholder="Vault Bio..." className="w-full bg-black/40 border border-white/5 p-4 rounded-xl text-sm font-bold outline-none h-20 resize-none" />
                    </div>

                    <button 
                      onClick={saveProfile} 
                      disabled={isSavingProfile}
                      className="w-full py-4 bg-emerald-500 text-black font-black uppercase text-[10px] tracking-widest rounded-xl disabled:opacity-50"
                    >
                      {isSavingProfile ? 'Updating...' : 'Save Profile'}
                    </button>

                    <div className="pt-6 border-t border-white/5 space-y-3">
                      <button onClick={() => { if(isAdmin){ setView('admin'); } else { setShowPasscodeModal(true); } }} className="w-full flex justify-between items-center py-4 px-5 bg-white/5 rounded-xl border border-white/10">
                        <span className="text-[10px] font-black uppercase tracking-widest">Admin Control</span>
                        <SettingsIcon />
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {view === 'admin' && (
                <div className="space-y-8">
                  <h2 className="font-black text-4xl uppercase italic leading-[0.8]">ADMIN<br/><span className="text-emerald-500">PORTAL</span></h2>
                  <form onSubmit={handleAddProduct} className="bg-white/5 border border-emerald-500/20 p-6 rounded-[2rem] space-y-4">
                    <div onClick={() => adminFileRef.current.click()} className="w-full h-32 bg-black/40 border border-dashed border-white/10 rounded-xl flex items-center justify-center cursor-pointer overflow-hidden">
                      {newItem.img ? <img src={newItem.img} className="w-full h-full object-cover" /> : <CameraIcon />}
                      <input type="file" accept="image/*" ref={adminFileRef} className="hidden" onChange={(e) => handleFileUpload(e, (res) => setNewItem({...newItem, img: res}))} />
                    </div>
                    <input value={newItem.name} onChange={e => setNewItem({...newItem, name: e.target.value})} placeholder="Product Name" className="w-full bg-black/40 border border-white/5 p-3 rounded-lg text-sm font-bold" />
                    <div className="flex gap-2">
                       <input value={newItem.price} onChange={e => setNewItem({...newItem, price: e.target.value})} placeholder="Price" className="flex-1 bg-black/40 border border-white/5 p-3 rounded-lg text-sm font-bold" />
                       <input value={newItem.thc} onChange={e => setNewItem({...newItem, thc: e.target.value})} placeholder="THC%" className="w-20 bg-black/40 border border-white/5 p-3 rounded-lg text-sm font-bold" />
                    </div>
                    <select value={newItem.category} onChange={e => setNewItem({...newItem, category: e.target.value})} className="w-full bg-black/40 border border-white/5 p-3 rounded-lg text-sm font-bold">
                      <option value="Strains">Strains</option><option value="Vapes">Vapes</option><option value="Edibles">Edibles</option><option value="Gear">Gear</option>
                    </select>
                    <button className="w-full py-4 bg-emerald-500 text-black font-black uppercase text-[10px] tracking-widest rounded-xl">Add to Stock</button>
                  </form>
                  
                  <div className="space-y-3">
                    {inventory.map(item => (
                      <div key={item.id} className="flex items-center justify-between p-3 bg-white/5 rounded-xl border border-white/5">
                        <div className="flex items-center gap-3">
                          <img src={item.img} className="w-10 h-10 rounded-lg object-cover" />
                          <span className="text-xs font-bold">{item.name}</span>
                        </div>
                        <button onClick={() => deleteProduct(item.id)} className="text-red-500 p-2"><TrashIcon /></button>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {view === 'chat' && (
                <div className="flex flex-col h-[75vh]">
                  {/* Real-time On-Site Chat Logic */}
                  {isAdmin && !selectedChatUserId ? (
                    // Admin Thread Directory View
                    <div className="flex-1 overflow-y-auto space-y-4">
                      <h3 className="font-black text-2xl uppercase italic text-emerald-500 mb-6">SECURE SECRETS</h3>
                      {activeAdminThreads.length === 0 ? (
                        <div className="text-center py-20 opacity-30 uppercase font-black text-xs">Awaiting Customer Tunnels...</div>
                      ) : (
                        activeAdminThreads.map(thread => (
                          <div 
                            key={thread.roomId} 
                            onClick={() => setSelectedChatUserId(thread.roomId)}
                            className="flex items-center justify-between p-4 bg-white/5 border border-white/5 rounded-2xl cursor-pointer hover:border-emerald-500/40 transition-all"
                          >
                            <div className="flex items-center gap-3">
                              <img src={thread.senderPhoto} className="w-10 h-10 rounded-xl object-cover" />
                              <div className="text-left">
                                <h4 className="font-bold text-sm text-white">{thread.senderName}</h4>
                                <p className="text-[10px] text-zinc-500 line-clamp-1">{thread.latestMessage}</p>
                              </div>
                            </div>
                            <span className="text-[9px] bg-emerald-500/20 text-emerald-400 px-3 py-1 rounded-full font-black uppercase">Open</span>
                          </div>
                        ))
                      )}
                    </div>
                  ) : (
                    // 1-on-1 Real-time Room Chat View
                    <div className="flex flex-col flex-1 bg-white/5 border border-white/5 rounded-[2rem] overflow-hidden">
                      {/* Chat Room Header */}
                      <div className="flex items-center justify-between px-6 py-4 bg-black/40 border-b border-white/5">
                        <div className="flex items-center gap-2">
                          {isAdmin && (
                            <button onClick={() => setSelectedChatUserId(null)} className="mr-2 text-emerald-500 font-bold">← Back</button>
                          )}
                          <div className="w-2.5 h-2.5 bg-emerald-500 rounded-full animate-pulse"></div>
                          <span className="text-xs font-black uppercase tracking-widest text-emerald-500">
                            {isAdmin ? "Tunneling Customer" : "Secure Tunnel with Alenje Exotics"}
                          </span>
                        </div>
                      </div>

                      {/* Chat Messages */}
                      <div className="flex-1 overflow-y-auto p-5 space-y-4 no-scrollbar">
                        {activeMessages.map(msg => {
                          const isMe = msg.senderId === user?.uid;
                          return (
                            <div key={msg.id} className={`flex ${isMe ? 'justify-end' : 'justify-start'}`}>
                              <div className={`max-w-[80%] rounded-2xl p-4 text-xs font-medium ${isMe ? 'bg-emerald-500 text-black rounded-tr-none' : 'bg-white/5 text-white border border-white/5 rounded-tl-none'}`}>
                                <p className="font-bold text-[8px] uppercase tracking-wider opacity-60 mb-1">{msg.senderName}</p>
                                <p className="leading-relaxed">{msg.text}</p>
                              </div>
                            </div>
                          );
                        })}
                        <div ref={chatEndRef}></div>
                      </div>

                      {/* Chat Form Input */}
                      <form onSubmit={handleSendMessage} className="p-4 bg-black/60 border-t border-white/5 flex gap-2">
                        <input 
                          type="text"
                          value={chatInput}
                          onChange={e => setChatInput(e.target.value)}
                          placeholder="Transmit message..."
                          className="flex-1 bg-white/5 border border-white/10 px-4 py-3 rounded-xl text-xs font-bold outline-none focus:border-emerald-500 placeholder:opacity-20"
                        />
                        <button type="submit" className="w-11 h-11 bg-emerald-500 text-black rounded-xl flex items-center justify-center hover:scale-105 active:scale-95 transition-all">
                          <SendIcon />
                        </button>
                      </form>
                    </div>
                  )}
                </div>
              )}
            </main>

            {/* Navigation Bar */}
            <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-[380px] bg-black/60 backdrop-blur-2xl border border-white/5 rounded-[2rem] p-2 flex justify-around items-center z-[200] shadow-2xl">
              <button onClick={() => setView('menu')} className={`flex-1 py-3.5 flex items-center justify-center rounded-[1.4rem] transition-all ${view === 'menu' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'opacity-20 hover:opacity-40'}`}>
                <HomeIcon />
              </button>
              <button onClick={() => setView('community')} className={`flex-1 py-3.5 flex items-center justify-center rounded-[1.4rem] transition-all ${view === 'community' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'opacity-20 hover:opacity-40'}`}>
                <UsersIcon />
              </button>
              <button onClick={() => setView('chat')} className={`flex-1 py-3.5 flex items-center justify-center rounded-[1.4rem] transition-all ${view === 'chat' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'opacity-20 hover:opacity-40'}`}>
                <ChatIcon />
              </button>
              <button onClick={() => setView('settings')} className={`flex-1 py-3.5 flex items-center justify-center rounded-[1.4rem] transition-all ${view === 'settings' || view === 'admin' ? 'bg-emerald-500 text-black shadow-lg shadow-emerald-500/20' : 'opacity-20 hover:opacity-40'}`}>
                <SettingsIcon />
              </button>
            </nav>

            {/* Admin Security Passcode Modal */}
            {showPasscodeModal && (
              <div className="fixed inset-0 z-[250] flex items-center justify-center p-6">
                <div className="absolute inset-0 bg-black/90 backdrop-blur-md" onClick={() => setShowPasscodeModal(false)}></div>
                <div className="relative bg-[#0d0d0d] border border-emerald-500/20 w-full max-w-sm rounded-[2rem] p-8 shadow-2xl">
                  <div className="text-center mb-6">
                    <div className="w-12 h-12 bg-emerald-500/10 border border-emerald-500/30 rounded-xl flex items-center justify-center mx-auto mb-4">
                      <SettingsIcon />
                    </div>
                    <h3 className="text-xl font-black uppercase italic text-emerald-500">Enter Access Key</h3>
                    <p className="text-[10px] opacity-40 font-black tracking-widest uppercase mt-1">Admin Authorization Required</p>
                  </div>

                  <form onSubmit={verifyAdminAccess} className="space-y-4">
                    <input 
                      type="password"
                      value={passcodeInput}
                      onChange={(e) => setPasscodeInput(e.target.value)}
                      placeholder="••••••••"
                      className="w-full bg-black/50 border border-white/5 p-4 rounded-xl text-center text-lg tracking-widest font-bold outline-none focus:border-emerald-500"
                      autoFocus
                    />
                    {passcodeError && (
                      <p className="text-red-500 text-[10px] font-black uppercase text-center tracking-wider">Invalid Passcode</p>
                    )}
                    <button 
                      type="submit"
                      className="w-full py-4 bg-emerald-500 text-black font-black text-[10px] uppercase tracking-widest rounded-xl shadow-lg shadow-emerald-500/20"
                    >
                      Authenticate
                    </button>
                    <button 
                      type="button"
                      onClick={() => {
                        setShowPasscodeModal(false);
                        setPasscodeError(false);
                        setPasscodeInput("");
                      }}
                      className="w-full text-[9px] font-black text-zinc-500 uppercase tracking-widest hover:text-white text-center"
                    >
                      Cancel
                    </button>
                  </form>
                </div>
              </div>
            )}

          </div>
        </div>
      );
    }

    // Render App
    const container = document.getElementById('root');
    const root = ReactDOM.createRoot(container);
    root.render(<App />);
  </script>
</body>
</html>
