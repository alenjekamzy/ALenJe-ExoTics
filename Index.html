<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALenJe ExoTics | Official</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, serverTimestamp, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        window.FirebaseSDK = { initializeApp, getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, serverTimestamp, getAuth, signInAnonymously, getDocs };
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; margin: 0; overflow-x: hidden; }
        .street-text { font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .highlight-logo { text-shadow: 0 0 20px rgba(16, 185, 129, 0.8); }
        .thc-tag { background: linear-gradient(135deg, #10b981, #064e3b); border: 1px solid rgba(255,255,255,0.2); }
    </style>
</head>
<body class="bg-zinc-950">
    <div id="root"></div>
    <script type="text/babel">
        const firebaseConfig = {
          apiKey: "AIzaSyCUxzypGZxXnrRhfO0BiqkgcaSlVdgVON8",
          authDomain: "alenje-exotics.firebaseapp.com",
          projectId: "alenje-exotics",
          storageBucket: "alenje-exotics.firebasestorage.app",
          messagingSenderId: "25574137051",
          appId: "1:25574137051:web:a23b21764cd269560600fe"
        };

        const PotIcon = () => (
            <svg width="30" height="30" viewBox="0 0 24 24" fill="#10b981">
                <path d="M12 22C12 22 13 18 17 15C18 14 22 14 22 14C22 14 18 13 15 11C16 7 15 2 15 2C15 2 13 6 12 10C11 6 9 2 9 2C9 2 8 7 9 11C6 13 2 14 2 14C2 14 6 14 7 15C11 18 12 22 12 22Z" />
            </svg>
        );

        const App = () => {
            const { initializeApp, getFirestore, collection, doc, onSnapshot, addDoc, deleteDoc, serverTimestamp, getAuth, signInAnonymously, getDocs } = window.FirebaseSDK;
            const [products, setProducts] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const [view, setView] = React.useState('menu');
            const [pass, setPass] = React.useState("");
            const [isAdmin, setIsAdmin] = React.useState(false);

            const app = React.useMemo(() => initializeApp(firebaseConfig), []);
            const db = React.useMemo(() => getFirestore(app), [app]);
            const auth = React.useMemo(() => getAuth(app), [app]);
            const COL = "inventory_live_final";

            React.useEffect(() => {
                const start = async () => {
                    await signInAnonymously(auth);
                    const dataCol = collection(db, 'artifacts', 'alenje-web', 'public', 'data', COL);
                    const snap = await getDocs(dataCol);
                    
                    if(snap.empty) {
                        const samples = [
                            { name: "Blue Diesel Kush", price: "120", thc: "28", type: "Hybrid", image: "https://images.unsplash.com/photo-1533473359331-0135ef1b58bf?w=800" },
                            { name: "Purple Kamzy Kush", price: "150", thc: "31", type: "Indica", image: "https://images.unsplash.com/photo-1603903052732-f820c59b4b3e?w=800" },
                            { name: "Swaz", price: "80", thc: "22", type: "Sativa", image: "https://images.unsplash.com/photo-1596753006433-289524458f7e?w=800" },
                            { name: "Malawi Gold", price: "100", thc: "25", type: "Sativa", image: "https://images.unsplash.com/photo-1628155930542-3c7a64e2c833?w=800" }
                        ];
                        for(let s of samples) await addDoc(dataCol, {...s, created: serverTimestamp()});
                    }

                    onSnapshot(dataCol, s => {
                        setProducts(s.docs.map(d => ({id: d.id, ...d.data()})));
                        setLoading(false);
                    });
                };
                start();
            }, []);

            if(loading) return <div className="h-screen flex items-center justify-center bg-black"><PotIcon /></div>;

            return (
                <div className="max-w-md mx-auto min-h-screen bg-black border-x border-white/5">
                    <nav className="glass sticky top-0 z-50 p-6 flex justify-between items-center border-b border-emerald-500/20">
                        <div className="flex items-center gap-3">
                            <PotIcon />
                            <h1 className="text-2xl street-text highlight-logo text-emerald-400" onClick={() => setView('menu')}>ALEnJe ExoTics</h1>
                        </div>
                        <button onClick={() => setView('admin')} className="text-[10px] font-black uppercase text-white/30">Portal</button>
                    </nav>

                    <main className="p-6">
                        {view === 'menu' ? (
                            <div className="space-y-10">
                                <header className="glass rounded-[3rem] p-12 text-center border-emerald-500/10 border mt-4">
                                    <h2 className="text-4xl street-text mb-2">Malawi<br/><span className="text-emerald-500">Exotics</span></h2>
                                    <p className="text-[10px] font-black uppercase tracking-[0.5em] opacity-30 italic">High Grade Distribution</p>
                                </header>

                                <div className="space-y-12 pb-24">
                                    {products.map(p => (
                                        <div key={p.id} className="glass rounded-[2.5rem] overflow-hidden border border-white/5">
                                            <div className="h-72 bg-zinc-900 relative">
                                                <img src={p.image} className="w-full h-full object-cover grayscale brightness-75" />
                                                <div className="absolute top-6 left-6 thc-tag px-5 py-2 rounded-full text-[12px] font-black">{p.thc}% THC</div>
                                            </div>
                                            <div className="p-8 flex justify-between items-center">
                                                <div>
                                                    <h3 className="street-text text-3xl text-white">{p.name}</h3>
                                                    <p className="text-3xl font-black italic text-emerald-500">${p.price}</p>
                                                </div>
                                                <button className="bg-white text-black px-8 py-4 rounded-2xl font-black text-[11px] uppercase shadow-xl">Order</button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        ) : (
                            <div className="glass p-10 rounded-[3rem] text-center space-y-6 mt-10">
                                {!isAdmin ? (
                                    <>
                                        <h2 className="street-text text-emerald-500 text-2xl">Access Key</h2>
                                        <input type="password" placeholder="EMAIL KEY" className="w-full bg-black p-5 rounded-2xl text-center text-emerald-400 font-bold border border-white/10" onChange={e => setPass(e.target.value)} />
                                        <button onClick={() => pass === "kamzyslime7@gmail.com" ? setIsAdmin(true) : alert("Wrong Key")} className="w-full bg-white text-black py-4 rounded-2xl font-black uppercase text-sm">Verify</button>
                                    </>
                                ) : (
                                    <div className="space-y-6 text-left">
                                        <h2 className="street-text text-emerald-500">Inventory Management</h2>
                                        <div className="divide-y divide-white/5">
                                            {products.map(p => (
                                                <div key={p.id} className="py-4 flex justify-between">
                                                    <span className="text-xs font-bold uppercase">{p.name}</span>
                                                    <button onClick={() => deleteDoc(doc(db, 'artifacts', 'alenje-web', 'public', 'data', COL, p.id))} className="text-red-500 font-black text-[10px]">REMOVE</button>
                                                </div>
                                            ))}
                                        </div>
                                        <button onClick={() => setView('menu')} className="w-full text-center opacity-20 text-[10px] font-black uppercase mt-10">Close</button>
                                    </div>
                                )}
                            </div>
                        )}
                    </main>
                    <footer className="py-20 text-center opacity-10 font-black uppercase text-[10px] tracking-[0.8em]">Alenje Exotics Worldwide</footer>
                </div>
            );
        };
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
