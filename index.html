<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ALenJe ExoTics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background: #000; color: #fff; margin: 0; }
        .street-text { font-style: italic; font-weight: 900; text-transform: uppercase; letter-spacing: -0.05em; }
        .glass { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .emerald-glow { text-shadow: 0 0 15px rgba(16, 185, 129, 0.6); }
        /* Prevent freezing by making sure the root is visible */
        #root { min-height: 100vh; display: flex; flex-direction: column; }
    </style>
</head>
<body>
    <div id="root">
        <!-- Manual Fallback if JS fails -->
        <div id="loader" style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #000;">
            <svg width="50" height="50" viewBox="0 0 24 24" fill="#10b981" style="animation: pulse 2s infinite;">
                <path d="M12 22C12 22 13 18 17 15C18 14 22 14 22 14C22 14 18 13 15 11C16 7 15 2 15 2C15 2 13 6 12 10C11 6 9 2 9 2C9 2 8 7 9 11C6 13 2 14 2 14C2 14 6 14 7 15C11 18 12 22 12 22Z" />
            </svg>
            <p style="color: #10b981; font-family: sans-serif; font-size: 10px; margin-top: 20px; letter-spacing: 2px;">STARTING ALENJE...</p>
        </div>
    </div>

    <script type="text/babel">
        const App = () => {
            const [loaded, setLoaded] = React.useState(false);

            React.useEffect(() => {
                // Remove the manual loader once React starts
                const loader = document.getElementById('loader');
                if (loader) loader.style.display = 'none';
                setLoaded(true);
            }, []);

            if (!loaded) return null;

            return (
                <div className="flex-1 flex flex-col p-6 animate-in fade-in duration-700">
                    <nav className="flex justify-between items-center py-4">
                        <div className="flex items-center gap-2">
                            <span className="street-text text-2xl emerald-glow text-emerald-400">ALEnJe</span>
                        </div>
                        <div className="text-[10px] font-black opacity-30 uppercase tracking-widest">v1.0.4</div>
                    </nav>

                    <main className="flex-1 flex flex-col items-center justify-center space-y-12 py-10">
                        <header className="text-center">
                            <h1 className="text-7xl street-text leading-[0.85] mb-4">
                                ALenJe <br/>
                                <span className="text-emerald-500">ExoTics</span>
                            </h1>
                            <div className="h-1 w-20 bg-emerald-500 mx-auto rounded-full"></div>
                        </header>

                        <div className="glass p-8 rounded-[2.5rem] w-full max-w-sm text-center space-y-6">
                            <p className="text-sm font-bold opacity-80">
                                Official menu is currently offline for maintenance.
                            </p>
                            <a href="https://wa.me/yournumber" className="block w-full bg-emerald-500 text-black py-4 rounded-2xl font-black uppercase text-xs tracking-widest active:scale-95 transition-transform">
                                Direct Inquiries
                            </a>
                        </div>
                    </main>

                    <footer className="text-center py-10 opacity-20">
                        <p className="text-[8px] font-black uppercase tracking-[0.8em]">Premium Production</p>
                    </footer>
                </div>
            );
        };

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
