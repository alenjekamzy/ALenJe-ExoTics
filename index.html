<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alenje Exotics | Premium Supply</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#030303] text-white font-sans antialiased">

    <div id="root"></div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <script type="text/babel">
        // --- Firebase Initialization ---
        const firebaseConfig = {
            apiKey: "AIzaSyCUxzypGZxXnrRhfO0BiqkgcaSlVdgVON8",
            authDomain: "alenje-exotics.firebaseapp.com",
            projectId: "alenje-exotics",
            storageBucket: "alenje-exotics.firebasestorage.app",
            messagingSenderId: "25574137051",
            appId: "1:25574137051:web:a23b21764cd269560600fe"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();
        const appId = 'alenje-exotics';
        const ADMIN_EMAIL = "kamzyslime7@gmail.com";

        // Minimalist SVG Icon Assets
        const HomeIcon = () => <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>;
        const UsersIcon = () => <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>;
        const ChatIcon = () => <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>;
        const SettingsIcon = () => <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>;
        const SunIcon = () => <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1z"/></svg>;
        const MoonIcon = () => <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12.1 22c4.9 0 9-3.6 10-8.3.2-1.1-.9-1.9-1.8-1.5-1.1.5-2.2.8-3.5.8-4.4 0-8-3.6-8-8 0-1.2.3-2.4.8-3.5.4-.9-.4-1.9-1.5-1.8C3.6 1 0 5.1 0 10c0 6.6 5.4 12 12.1 12z"/></svg>;
        const CameraIcon = () => <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M12 12m-3.2 0a3.2 3.2 0 1 0 6.4 0a3.2 3.2 0 1 0 -6.4 0M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5s5 2.24 5 5s-2.24 5-5 5z"/></svg>;
        const TrashIcon = () => <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" strokeLinecap="round" strokeLinejoin="round"/></svg>;
        const BellIcon = () => <svg width="20" height="20" fill="none" stroke="currentColor" strokeWidth="2.5" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0"/></svg>;

        function App() {
            const [user, setUser] = React.useState(null);
            const [profile, setProfile] = React.useState({ name: '', photo: '', caption: '', phone: '' });
            const [view, setView] = React.useState('menu'); 
            const [category, setCategory] = React.useState('All');
            const [inventory, setInventory] = React.useState([]);
            const [posts, setPosts] = React.useState([]);
            const [notifications, setNotifications] = React.useState([]);
            const [chatMessages, setChatMessages] = React.useState([]);
            const [newMsg, setNewMsg] = React.useState("");
            const [loading, setLoading] = React.useState(true);
            const [isSavingProfile, setIsSavingProfile] = React.useState(false);
            const [darkMode, setDarkMode] = React.useState(true);
            const [newPost, setNewPost] = React.useState("");
            const [postImage, setPostImage] = React.useState("");
            const [unreadNotifications, setUnreadNotifications] = React.useState(0);

            // Access states
            const [allowNotifications, setAllowNotifications] = React.useState(false);
            const [allowLocation, setAllowLocation] = React.useState(false);
            const [userLocation, setUserLocation] = React.useState(null);
            const [chatWallpaper, setChatWallpaper] = React.useState(localStorage.getItem('chat_bg') || "");

            const [newItem, setNewItem] = React.useState({ name: '', price: '', category: 'Strains', thc: '24', img: '' });

            const postFileRef = React.useRef(null);
            const adminFileRef = React.useRef(null);
            const profileFileRef = React.useRef(null);
            const wallpaperFileRef = React.useRef(null);
            const chatEndRef = React.useRef(null);

            React.useEffect(() => {
                const unsubscribe = auth.onAuthStateChanged(async (u) => {
                    setUser(u);
                    if (u) {
                        const profileRef = db.collection('artifacts').doc(appId).collection('users').doc(u.uid).collection('profile').doc('info');
                        const snap = await profileRef.get();
                        if (snap.exists) {
                            setProfile(snap.data());
                        } else {
                            const initialProfile = {
                                name: u.displayName || 'Exotic Member',
                                photo: u.photoURL || `https://api.dicebear.com/7.x/bottts/svg?seed=${u.uid}`,
                                caption: 'Exploring Alenje Exotics',
                                phone: ''
                            };
                            await profileRef.set(initialProfile);
                            setProfile(initialProfile);
                        }
                    }
                    setLoading(false);
                });
                return () => unsubscribe();
            }, []);

            React.useEffect(() => {
                if (!user) return;

                const unsubInv = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('inventory')
                    .onSnapshot(s => setInventory(s.docs.map(d => ({ id: d.id, ...d.data() }))));

                const unsubPosts = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('community')
                    .onSnapshot(s => {
                        const sorted = s.docs.map(d => ({ id: d.id, ...d.data() }))
                            .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                        setPosts(sorted);
                    });

                const unsubNotif = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('notifications')
                    .onSnapshot(s => {
                        const list = s.docs.map(d => ({ id: d.id, ...d.data() }))
                            .sort((a, b) => (b.timestamp?.seconds || 0) - (a.timestamp?.seconds || 0));
                        setNotifications(list);
                        setUnreadNotifications(list.length);
                    });

                const unsubChat = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('chat')
                    .onSnapshot(s => {
                        const list = s.docs.map(d => ({ id: d.id, ...d.data() }))
                            .sort((a, b) => (a.timestamp?.seconds || 0) - (b.timestamp?.seconds || 0));
                        setChatMessages(list);
                    });

                return () => { unsubInv(); unsubPosts(); unsubNotif(); unsubChat(); };
            }, [user]);

            React.useEffect(() => {
                if (view === 'chat') chatEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [chatMessages, view]);

            const loginWithGoogle = async () => {
                const provider = new firebase.auth.GoogleAuthProvider();
                try { await auth.signInWithPopup(provider); } catch (err) { console.error(err); }
            };

            const toggleLocationAccess = () => {
                if (!allowLocation) {
                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition((position) => {
                            setUserLocation({ lat: position.coords.latitude, lng: position.coords.longitude });
                            setAllowLocation(true);
                        }, (err) => console.error(err));
                    }
                } else {
                    setAllowLocation(false);
                    setUserLocation(null);
                }
            };

            const handleFileUpload = (e, callback) => {
                const file = e.target.files[0];
                if (!file) return;
                if (file.size > 2097152) return;
                const reader = new FileReader();
                reader.onloadend = () => callback(reader.result);
                reader.readAsDataURL(file);
            };

            const handleWallpaperChange = (e) => {
                handleFileUpload(e, (res) => {
                    setChatWallpaper(res);
                    localStorage.setItem('chat_bg', res);
                });
            };

            const saveProfile = async () => {
                if (!user) return;
                setIsSavingProfile(true);
                try {
                    await db.collection('artifacts').doc(appId).collection('users').doc(user.uid).collection('profile').doc('info').set({
                        ...profile, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                } catch (err) { console.error(err); } finally { setIsSavingProfile(false); }
            };

            const handlePost = async (e) => {
                e.preventDefault();
                if (!user || (!newPost.trim() && !postImage)) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('community').add({
                        text: newPost, image: postImage, userName: profile.name, userPhoto: profile.photo, userPhone: profile.phone, timestamp: firebase.firestore.FieldValue.serverTimestamp(), uid: user.uid
                    });
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('notifications').add({
                        title: "New Community Update", message: `${profile.name} dropped a new post in the Local Vibe.`, sender: profile.name, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewPost(""); setPostImage("");
                } catch (err) { console.error(err); }
            };

            const sendChatMessage = async (e) => {
                e.preventDefault();
                if (!newMsg.trim()) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('chat').add({
                        text: newMsg, userName: profile.name, userPhoto: profile.photo, uid: user.uid, timestamp: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewMsg("");
                } catch (err) { console.error(err); }
            };

            const handleAddProduct = async (e) => {
                e.preventDefault();
                if (!newItem.name || !newItem.price) return;
                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').collection('inventory').add({
                        ...newItem, createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewItem({ name: '', price: '', category: 'Strains', thc: '24', img: '' });
                } catch (err) { console.error(err); }
            };

            if (loading) return <div className="h-screen flex items-center justify-center bg-black text-emerald-500 font-black uppercase text-xs tracking-widest animate-pulse">Establishing Connection...</div>;

            if (!user) {
                return (
                    <div className="h-screen w-full bg-[#030303] flex flex-col items-center justify-center px-6 text-white">
                        <div className="w-20 h-20 bg-emerald-500 rounded-2xl flex items-center justify-center shadow-2xl mb-8 animate-bounce">
                            <svg width="36" height="36" viewBox="0 0 24 24" fill="black"><path d="M12,22C12,22 13,17.5 16,14C19,10.5 22,10 22,10C22,10 17.5,11 14,14C12.8,15.2 12,17 12,17C12,17 11.2,15.2 10,14C6.5,11 2,10 2,10C2,10 5,10.5 8,14C11,17.5 12,22 12,22M12,17V12M12,12C12,12 11,8 8,5.5C5,3 2,2 2,2C2,2 5.5,3 8,6C9.5,7.8 10,10 10,10C10,10 11,8 12,7C13,8 14,10 14,10C14,10 14.5,7.8 16,6C18.5,3 22,2 22,2C22,2 19,3 16,5.5C13,8 12,12 12,12Z" /></svg>
                        </div>
                        <h1 className="font-black text-[42px] tracking-tighter uppercase italic text-center leading-none mb-2">ALENJE<br/><span className="text-emerald-500">EXOTICS</span></h1>
                        <p className="opacity-40 text-[9px] uppercase tracking-[0.4em] mb-12 text-center">Secure Verification Required</p>
                        <button onClick={loginWithGoogle} className="w-full max-w-[320px] py-5 bg-white text-black font-black text-xs uppercase tracking-widest rounded-2xl flex items-center justify-center gap-4 shadow-xl">
                            Sign In With Google
                        </button>
                    </div>
                );
            }

            return (
                <div className={`min-h-screen transition-colors duration-500 ${darkMode ? 'bg-[#030303] text-white' : 'bg-[#f8f9fa] text-black'}`}>
                    <div className="max-w-[440px] mx-auto px-5 pb-40">
                        <header className="sticky top-0 z-[100] py-6 flex justify-between items-center bg-transparent backdrop-blur-md">
                            <div className="flex items-center gap-3 cursor-pointer" onClick={() => setView('menu')}>
                                <div className="w-10 h-10 bg-emerald-500 rounded-xl flex items-center justify-center shadow-lg"><svg width="20" height="20" viewBox="0 0 24 24" fill="black"><path d="M12,22C12,22 13,17.5 16,14C19,10.5 22,10 22,10C22,10 17.5,11 14,14C12.8,15.2 12,17 12,17C12,17 11.2,15.2 10,14C6.5,11 2,10 2,10C2,10 5,10.5 8,14C11,17.5 12,22 12,22M12,17V12M12,12C12,12 11,8 8,5.5C5,3 2,2 2,2C2,2 5.5,3 8,6C9.5,7.8 10,10 10,10C10,10 11,8 12,7C13,8 14,10 14,10C14,10 14.5,7.8 16,6C18.5,3 22,2 22,2C22,2 19,3 16,5.5C13,8 12,12 12,12Z" /></svg></div>
                                <span className="font-black text-lg italic uppercase text-emerald-500 tracking-tighter">Alenje</span>
                            </div>
                            <div className="flex items-center gap-2">
                                <button onClick={() => { setView('notifications'); setUnreadNotifications(0); }} className="relative w-11 h-11 bg-white/5 border border-white/10 rounded-xl flex items-center justify-center">
                                    <BellIcon />
                                    {unreadNotifications > 0 && <span className="absolute -top-1 -right-1 bg-emerald-500 text-black font-black text-[8px] w-4 h-4 rounded-full flex items-center justify-center">{unreadNotifications}</span>}
                                </button>
                                <button onClick={() => setDarkMode(!darkMode)} className="w-11 h-11 bg-white/5 border border-white/10 rounded-xl flex items-center justify-center">
                                    {darkMode ? <SunIcon /> : <MoonIcon />}
                                </button>
                            </div>
                        </header>

                        <main>
                            {view === 'menu' && (
                                <div className="animate-in fade-in">
                                    <div className="text-center py-6">
                                        <h1 className="font-black text-[60px] leading-[0.75] tracking-tighter uppercase italic">ALENJE<br/><span className="text-emerald-500">EXOTICS</span></h1>
                                        <p className="opacity-30 text-[9px] font-black uppercase tracking-[0.5em] mt-4">Premium Logistics & Supply</p>
                                    </div>
                                    <div className="flex gap-3 overflow-x-auto pb-4 mb-6">
                                        {['All', 'Strains', 'Vapes', 'Edibles', 'Gear'].map(cat => (
                                            <button key={cat} onClick={() => setCategory(cat)} className={`px-6 py-3.5 rounded-xl text-[10px] font-black uppercase tracking-widest ${category === cat ? 'bg-emerald-500 text-black shadow-lg' : 'bg-white/5 opacity-50'}`}>{cat}</button>
                                        ))}
                                    </div>
                                    <div className="grid gap-8">
                                        {inventory.filter(i => category === 'All' || i.category === category).map(item => (
                                            <div key={item.id} className="bg-white/5 border border-white/5 rounded-[2rem] overflow-hidden">
                                                <div className="relative h-[320px]">
                                                    <img src={item.img || "https://images.unsplash.com/photo-1536633314979-d204bfce4602?w=800"} className="w-full h-full object-cover" />
                                                    <div className="absolute top-4 right-4 bg-emerald-500 text-black px-3 py-1.5 rounded-full font-black text-[9px] uppercase">{item.thc || '24'}% THC</div>
                                                </div>
                                                <div className="p-6">
                                                    <div className="flex justify-between items-end mb-4">
                                                        <div>
                                                            <span className="text-[9px] font-black text-emerald-400 uppercase tracking-widest block mb-1">{item.category}</span>
                                                            <h3 className="font-black text-2xl uppercase italic leading-none">{item.name}</h3>
                                                        </div>
                                                        <span className="text-xl font-black italic text-emerald-500">MWK {item.price}</span>
                                                    </div>
                                                    <button onClick={() => setView('chat')} className="w-full py-4 bg-emerald-500 rounded-xl flex items-center justify-center font-black text-black text-[10px] uppercase tracking-widest">Secure Order Bridge</button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {view === 'notifications' && (
                                <div className="space-y-4">
                                    <h2 className="font-black text-4xl mb-6 uppercase italic">LIVE<br/><span className="text-emerald-500">ALERTS</span></h2>
                                    {notifications.length === 0 ? <p className="text-center opacity-30 py-12 text-xs font-bold uppercase">No Alerts</p> : notifications.map(n => (
                                        <div key={n.id} className="p-5 bg-white/5 border border-white/5 rounded-2xl">
                                            <span className="text-[10px] font-black uppercase text-emerald-400 block">{n.title}</span>
                                            <p className="text-xs opacity-80 mt-1">{n.message}</p>
                                        </div>
                                    ))}
                                </div>
                            )}

                            {view === 'community' && (
                                <div className="space-y-6">
                                    <h2 className="font-black text-4xl mb-6 uppercase italic">LOCAL<br/><span className="text-emerald-500">VIBE</span></h2>
                                    <form onSubmit={handlePost} className="bg-white/5 p-5 rounded-2xl">
                                        <textarea value={newPost} onChange={(e) => setNewPost(e.target.value)} placeholder="Show the community..." className="w-full bg-transparent outline-none text-xs min-h-[70px]" />
                                        {postImage && <div className="relative w-full h-44 rounded-xl overflow-hidden mb-4"><img src={postImage} className="w-full h-full object-cover" /><button type="button" onClick={() => setPostImage("")} className="absolute top-2 right-2 text-white">✕</button></div>}
                                        <div className="flex justify-between items-center mt-2">
                                            <button type="button" onClick={() => postFileRef.current.click()} className="text-emerald-500"><CameraIcon /><input type="file" accept="image/*" ref={postFileRef} className="hidden" onChange={(e) => handleFileUpload(e, setPostImage)} /></button>
                                            <button className="px-6 py-2.5 bg-emerald-500 text-black text-[10px] font-black uppercase rounded-xl">Post</button>
                                        </div>
                                    </form>
                                    <div className="space-y-6">
                                        {posts.map(post => (
                                            <div key={post.id} className="border-b border-white/5 pb-6">
                                                <div className="flex items-center gap-3 mb-3">
                                                    <img src={post.userPhoto} className="w-8 h-8 rounded-lg object-cover" />
                                                    <h4 className="font-bold text-xs uppercase">{post.userName}</h4>
                                                </div>
                                                {post.image && <img src={post.image} className="rounded-xl w-full max-h-[300px] object-cover mb-3" />}
                                                <p className="text-xs italic opacity-80">{post.text}</p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {view === 'chat' && (
                                <div className="flex flex-col h-[60vh] bg-white/5 border border-white/5 rounded-3xl overflow-hidden relative">
                                    <div className="absolute inset-0 opacity-15 bg-cover bg-center" style={{ backgroundImage: chatWallpaper ? `url(${chatWallpaper})` : 'none' }}></div>
                                    <div className="p-4 bg-black/40 border-b border-white/5 flex justify-between items-center z-10">
                                        <h3 className="font-black text-xs text-emerald-500 uppercase">Live Web Tunnel</h3>
                                        <button onClick={() => wallpaperFileRef.current.click()} className="p-1.5 bg-white/5 rounded border text-[8px] text-emerald-400">BG<input type="file" accept="image/*" ref={wallpaperFileRef} className="hidden" onChange={handleWallpaperChange} /></button>
                                    </div>
                                    <div className="flex-1 p-4 overflow-y-auto space-y-3 z-10">
                                        {chatMessages.map(msg => (
                                            <div key={msg.id} className={`flex gap-2 max-w-[80%] ${msg.uid === user.uid ? 'ml-auto flex-row-reverse' : ''}`}>
                                                <div className={`p-3 rounded-xl text-xs ${msg.uid === user.uid ? 'bg-emerald-500 text-black' : 'bg-white/10'}`}>{msg.text}</div>
                                            </div>
                                        ))}
                                        <div ref={chatEndRef} />
                                    </div>
                                    <form onSubmit={sendChatMessage} className="p-3 bg-black/40 border-t border-white/5 flex gap-2 z-10">
                                        <input value={newMsg} onChange={e => setNewMsg(e.target.value)} placeholder="Type a secure message..." className="flex-1 bg-black/40 text-xs px-3 rounded-xl outline-none" />
                                        <button className="px-4 py-2 bg-emerald-500 text-black text-xs rounded-xl font-bold">Send</button>
                                    </form>
                                </div>
                            )}

                            {view === 'settings' && (
                                <div className="bg-white/5 rounded-3xl p-6 space-y-6">
                                    <div className="flex flex-col items-center">
                                        <img src={profile.photo} className="w-20 h-20 rounded-xl object-cover border border-emerald-500" />
                                        <span className="text-[10px] text-emerald-400 mt-2">{user.email}</span>
                                    </div>
                                    <div className="space-y-3">
                                        <input value={profile.name} onChange={e => setProfile({...profile, name: e.target.value})} placeholder="Name" className="w-full bg-black/40 p-3 rounded-xl text-xs outline-none" />
                                        <input value={profile.phone} onChange={e => setProfile({...profile, phone: e.target.value})} placeholder="Phone" className="w-full bg-black/40 p-3 rounded-xl text-xs outline-none" />
                                        <button onClick={saveProfile} className="w-full py-3 bg-emerald-500 text-black font-black text-xs uppercase rounded-xl">Save Identity</button>
                                    </div>
                                    <div className="pt-4 border-t border-white/5 space-y-2">
                                        <div className="flex justify-between items-center p-3 bg-black/20 rounded-xl text-xs">
                                            <span>Access Location Data</span>
                                            <input type="checkbox" checked={allowLocation} onChange={toggleLocationAccess} className="accent-emerald-500" />
                                        </div>
                                        <button onClick={() => auth.signOut()} className="w-full py-3 bg-red-500/10 text-red-500 text-xs rounded-xl border border-red-500/20 mt-4">Disconnect</button>
                                    </div>
                                </div>
                            )}
                        </main>

                        <nav className="fixed bottom-6 left-1/2 -translate-x-1/2 w-[90%] max-w-[360px] bg-black/80 backdrop-blur-3xl border border-white/10 rounded-2xl p-1.5 flex justify-around items-center z-[200]">
                            <button onClick={() => setView('menu')} className={`flex-1 py-3 flex items-center justify-center rounded-xl ${view === 'menu' ? 'bg-emerald-500 text-black' : 'opacity-30'}`}><HomeIcon /></button>
                            <button onClick={() => setView('community')} className={`flex-1 py-3 flex items-center justify-center rounded-xl ${view === 'community' ? 'bg-emerald-500 text-black' : 'opacity-30'}`}><UsersIcon /></button>
                            <button onClick={() => setView('chat')} className={`flex-1 py-3 flex items-center justify-center rounded-xl ${view === 'chat' ? 'bg-emerald-500 text-black' : 'opacity-30'}`}><ChatIcon /></button>
                            <button onClick={() => setView('settings')} className={`flex-1 py-3 flex items-center justify-center rounded-xl ${view === 'settings' ? 'bg-emerald-500 text-black' : 'opacity-30'}`}><SettingsIcon /></button>
                        </nav>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
